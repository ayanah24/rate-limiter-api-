version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: redis-rate-limiter
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: rate-limiter-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - WINDOW_SIZE_SECONDS=60
      - MAX_REQUESTS=10
      - BUCKET_CAPACITY=10
      - REFILL_RATE=1
      - SLIDING_WINDOW_SECONDS=60
      - SLIDING_MAX_REQUESTS=10
      - ADMIN_KEY=admin123
      - LOG_LEVEL=info
      - CONFIG_CACHE_TTL=60
    depends_on:
      - redis

  dashboard:
    build: ./dashboard
    container_name: rate-limit-dashboard
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  redis-data:
